# LAMS CI (LAMS-004): check-only deploy against the Lams org on every push and PR.
# Nothing is ever saved to the org by this workflow.
name: Validate

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch cancels the older run still in progress.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      # SFDX_AUTH_URL is a refresh token: never echo it or run `sf org display` here.
      - name: Authenticate org
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: |
          if [ -z "$SFDX_AUTH_URL" ]; then
            echo "::error::Repository secret SFDX_AUTH_URL is not set"
            exit 1
          fi
          echo "$SFDX_AUTH_URL" > ./authurl.txt
          sf org login sfdx-url --sfdx-url-file ./authurl.txt --alias lams-ci --set-default
          rm ./authurl.txt
          sf data query --query "SELECT Name FROM Organization" --target-org lams-ci

      # No metadata yet -> pass. No Apex -> dry-run without tests.
      # Apex present (from LAMS-019) -> validate with RunLocalTests (BRD §19).
      - name: Validate deploy
        run: |
          if [ -z "$(find force-app -type f ! -name '.gitkeep' 2>/dev/null | head -1)" ]; then
            echo "::notice::force-app has no metadata yet - nothing to validate"
            exit 0
          fi
          if ls force-app/main/default/classes/*.cls >/dev/null 2>&1; then
            sf project deploy validate --source-dir force-app --test-level RunLocalTests --wait 30 --target-org lams-ci
          else
            sf project deploy start --dry-run --source-dir force-app --test-level NoTestRun --wait 30 --target-org lams-ci
          fi
